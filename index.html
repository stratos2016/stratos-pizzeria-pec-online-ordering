<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strato's Pizzeria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Gloock&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }
    .logo-area {
      text-align: center;
    }
    .logo-area h1 {
      font-family: 'Gloock', serif;
      font-size: 2.5rem;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .logo-area p {
      color: #888;
      margin-top: 0.5rem;
      font-size: 0.95rem;
    }
    .cards {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 2rem 2.5rem;
      text-align: center;
      text-decoration: none;
      color: inherit;
      min-width: 200px;
      transition: border-color 0.2s, transform 0.2s;
    }
    .card:hover {
      border-color: #e53e3e;
      transform: translateY(-2px);
    }
    .card .icon { font-size: 2rem; margin-bottom: 0.75rem; }
    .card .label {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }
    .card .sub {
      font-size: 0.8rem;
      color: #666;
      margin-top: 0.35rem;
    }
  </style>
</head>
<body>
  <div class="logo-area">
    <h1>Strato's Pizzeria</h1>
    <p>Select a portal to continue</p>
  </div>
  <div class="cards">
    <a href="./index-customer.html" class="card">
      <div class="icon">🍕</div>
      <div class="label">Order Online</div>
      <div class="sub">Customer ordering app</div>
    </a>
    <a href="./index-staff.html" class="card">
      <div class="icon">📋</div>
      <div class="label">Staff Portal</div>
      <div class="sub">Order management & settings</div>
    </a>
  </div>
</body>
</html>
