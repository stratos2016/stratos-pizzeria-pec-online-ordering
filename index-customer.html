    if ((path.match(/^\/api\/orders\/\d+$/) || path.match(/^\/api\/orders\/\d+\/status/)) && method === 'PATCH') {
      var id = parseInt(path.split('/')[3]);
      var body = (opts && opts.body) ? JSON.parse(opts.body) : {};
      var orders = getOrders();
      var order = orders.find(function(o) { return o.id === id; });
      if (order) Object.assign(order, body);
      saveOrders(orders);
      broadcast({type:'order_updated', order:order});
      return Promise.resolve(new Response(JSON.stringify(order||{}), {status:200,headers:{'Content-Type':'application/json'}}));
    }

    if (path === '/api/settings' && method === 'GET')
      return Promise.resolve(new Response(JSON.stringify(SETTINGS), {status:200,headers:{'Content-Type':'application/json'}}));

    if (path.match(/^\/api\/settings\//) && method === 'PATCH') {
      var key = path.split('/')[3];
      var body = (opts && opts.body) ? JSON.parse(opts.body) : {};
      var entry = SETTINGS.find(function(s) { return s.key === key; });
      if (entry) { entry.value = body.value; } else { SETTINGS.push({key:key,value:body.value}); }
      return Promise.resolve(new Response(JSON.stringify({key:key,value:body.value}), {status:200,headers:{'Content-Type':'application/json'}}));
    }

    if (path === '/api/stats' && method === 'GET') {
      var orders = getOrders();
      var today = new Date().toDateString();
      var todayOrders = orders.filter(function(o) { return new Date(o.createdAt).toDateString()===today; });
      var active = orders.filter(function(o) { return ['new','working'].indexOf(o.status)>=0; }).length;
      return Promise.resolve(new Response(JSON.stringify({
        totalOrders:orders.length, todayOrders:todayOrders.length,
        todayRevenue:todayOrders.filter(function(o){return o.status!=='voided';}).reduce(function(s,o){return s+(o.total||0);},0),
        activeOrders:active
      }), {status:200,headers:{'Content-Type':'application/json'}}));
    }

    if (path === '/api/tables' && method === 'GET')
      return Promise.resolve(new Response('[]', {status:200,headers:{'Content-Type':'application/json'}}));

    // Loyalty
    if (path.match(/^\/api\/loyalty\/[\d]+$/) && method === 'GET') {
      var ph = path.split('/')[3];
      var c = window.__LOYALTY__[ph];
      if (!c) return Promise.resolve(new Response(JSON.stringify({error:'not found'}), {status:404,headers:{'Content-Type':'application/json'}}));
      return Promise.resolve(new Response(JSON.stringify(c), {status:200,headers:{'Content-Type':'application/json'}}));
    }
    if (path === '/api/loyalty' && method === 'POST') {
      var body = (opts && opts.body) ? JSON.parse(opts.body) : {};
      var nc = {phone:body.phone, name:body.name||'', points:0, history:[], enrolledAt:new Date().toISOString()};
      window.__LOYALTY__[body.phone] = nc;
      return Promise.resolve(new Response(JSON.stringify(nc), {status:201,headers:{'Content-Type':'application/json'}}));
    }
    if (path.match(/^\/api\/loyalty\/[\d]+\/adjust/) && method === 'POST') {
      var ph = path.split('/')[3];
      var body = (opts && opts.body) ? JSON.parse(opts.body) : {};
      var c = window.__LOYALTY__[ph];
      if (!c) return Promise.resolve(new Response(JSON.stringify({error:'not found'}), {status:404,headers:{'Content-Type':'application/json'}}));
      c.points = Math.max(0, c.points + (body.delta||0));
      c.history = c.history || [];
      c.history.push({delta:body.delta||0, note:body.note||'', at:new Date().toISOString()});
      return Promise.resolve(new Response(JSON.stringify(c), {status:200,headers:{'Content-Type':'application/json'}}));
    }

    return origFetch.apply(this, arguments);
  };
})();
