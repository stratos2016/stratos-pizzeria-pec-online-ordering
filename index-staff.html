    if ((path.match(/^\/api\/orders\/\d+$/) || path.match(/^\/api\/orders\/\d+\/status/)) && method === 'PATCH') {
      var id = parseInt(path.split('/')[3]);
      var body = (opts && opts.body) ? JSON.parse(opts.body) : {};
      var orders = getOrders();
      var order = orders.find(function(o) { return o.id === id; });
      if (order) Object.assign(order, body);
      saveOrders(orders);
      broadcast({type:'order_updated', order:order});
      return Promise.resolve(new Response(JSON.stringify(order||{}), {status:200,headers:{'Content-Type':'application/json'}}));
    }

    if (path === '/api/settings' && method === 'GET')
      return Promise.resolve(new Response(JSON.stringify(SETTINGS), {status:200,headers:{'Content-Type':'application/json'}}));

    if (path.match(/^\/api\/settings\//) && method === 'PATCH') {
      var key = path.split('/')[3];
      var body = (opts && opts.body) ? JSON.parse(opts.body) : {};
      var entry = SETTINGS.find(function(s) { return s.key === key; });
      if (entry) { entry.value = body.value; } else { SETTINGS.push({key:key,value:body.value}); }
      return Promise.resolve(new Response(JSON.stringify({key:key,value:body.value}), {status:200,headers:{'Content-Type':'application/json'}}));
    }

    if (path === '/api/stats' && method === 'GET') {
      var orders = getOrders();
      var today = new Date().toDateString();
      var todayOrders = orders.filter(function(o) { return new Date(o.createdAt).toDateString()===today; });
      var active = orders.filter(function(o) { return ['new','working'].indexOf(o.status)>=0; }).length;
      return Promise.resolve(new Response(JSON.stringify({
        totalOrders:orders.length, todayOrders:todayOrders.length,
        todayRevenue:todayOrders.filter(function(o){return o.status!=='voided';}).reduce(function(s,o){return s+(o.total||0);},0),
        activeOrders:active
      }), {status:200,headers:{'Content-Type':'application/json'}}));
    }

    if (path === '/api/tables' && method === 'GET')
      return Promise.resolve(new Response('[]', {status:200,headers:{'Content-Type':'application/json'}}));

    // Loyalty
    if (path.match(/^\/api\/loyalty\/[\d]+$/) && method === 'GET') {
      var ph = path.split('/')[3];
      var c = window.__LOYALTY__[ph];
      if (!c) return Promise.resolve(new Response(JSON.stringify({error:'not found'}), {status:404,headers:{'Content-Type':'application/json'}}));
      return Promise.resolve(new Response(JSON.stringify(c), {status:200,headers:{'Content-Type':'application/json'}}));
    }
    if (path === '/api/loyalty' && method === 'POST') {
      var body = (opts && opts.body) ? JSON.parse(opts.body) : {};
      var nc = {phone:body.phone, name:body.name||'', points:0, history:[], enrolledAt:new Date().toISOString()};
      window.__LOYALTY__[body.phone] = nc;
      return Promise.resolve(new Response(JSON.stringify(nc), {status:201,headers:{'Content-Type':'application/json'}}));
    }
    if (path.match(/^\/api\/loyalty\/[\d]+\/adjust/) && method === 'POST') {
      var ph = path.split('/')[3];
      var body = (opts && opts.body) ? JSON.parse(opts.body) : {};
      var c = window.__LOYALTY__[ph];
      if (!c) return Promise.resolve(new Response(JSON.stringify({error:'not found'}), {status:404,headers:{'Content-Type':'application/json'}}));
      c.points = Math.max(0, c.points + (body.delta||0));
      c.history = c.history || [];
      c.history.push({delta:body.delta||0, note:body.note||'', at:new Date().toISOString()});
      return Promise.resolve(new Response(JSON.stringify(c), {status:200,headers:{'Content-Type':'application/json'}}));
    }

    return origFetch.apply(this, arguments);
  };
})();
</script>

      + '<input id="__new_name__" type="text" placeholder="e.g. Caesar Wrap" style="width:100%;font-size:14px;border:1px solid '+border+';border-radius:8px;padding:8px 12px;background:'+bg+';color:'+text+';box-sizing:border-box">'
      + '</div>'
      // Category
      + '<div style="margin-bottom:14px">'
      + '<label style="font-size:12px;font-weight:600;color:'+muted+';display:block;margin-bottom:4px">Category *</label>'
      + '<select id="__new_cat__" style="width:100%;font-size:14px;border:1px solid '+border+';border-radius:8px;padding:8px 12px;background:'+bg+';color:'+text+';box-sizing:border-box;margin-bottom:6px">'
      + catOptions
      + '<option value="__new__">+ New category...</option>'
      + '</select>'
      + '<input id="__new_cat_custom__" type="text" placeholder="New category name" style="width:100%;font-size:14px;border:1px solid '+border+';border-radius:8px;padding:8px 12px;background:'+bg+';color:'+text+';box-sizing:border-box;display:none">'
      + '</div>'
      // Description
      + '<div style="margin-bottom:14px">'
      + '<label style="font-size:12px;font-weight:600;color:'+muted+';display:block;margin-bottom:4px">Description</label>'
      + '<input id="__new_desc__" type="text" placeholder="e.g. Grilled chicken, romaine, parmesan" style="width:100%;font-size:14px;border:1px solid '+border+';border-radius:8px;padding:8px 12px;background:'+bg+';color:'+text+';box-sizing:border-box">'
      + '</div>'
      // Price
      + '<div style="margin-bottom:20px">'
      + '<label style="font-size:12px;font-weight:600;color:'+muted+';display:block;margin-bottom:4px">Price *</label>'
      + '<div style="display:flex;align-items:center;border:1px solid '+border+';border-radius:8px;overflow:hidden">'
      + '<span style="padding:8px 12px;background:'+muted+';color:#fff;font-size:14px;font-weight:600">$</span>'
      + '<input id="__new_price__" type="number" step="0.01" min="0" placeholder="0.00" style="flex:1;font-size:14px;border:none;padding:8px 12px;background:'+bg+';color:'+text+';outline:none">'
      + '</div>'
      + '</div>'
      // Error
      + '<p id="__new_err__" style="color:#dc2626;font-size:12px;margin:0 0 12px;display:none">Please fill in all required fields.</p>'
      // Buttons
      + '<div style="display:flex;gap:10px">'
      + '<button id="__modal_cancel__" style="flex:1;padding:10px;border:1px solid '+border+';border-radius:8px;background:transparent;color:'+text+';font-size:14px;cursor:pointer">Cancel</button>'
      + '<button id="__modal_save__" style="flex:1;padding:10px;border:none;border-radius:8px;background:#c09b6d;color:#0d1b34;font-size:14px;font-weight:600;cursor:pointer">Add Item</button>'
      + '</div>'
      + '</div>';

    document.body.appendChild(modal);

    // Show/hide custom category input
    document.getElementById('__new_cat__').addEventListener('change', function() {
      document.getElementById('__new_cat_custom__').style.display = this.value === '__new__' ? 'block' : 'none';
    });

    function closeModal() { modal.remove(); }
    document.getElementById('__modal_close__').addEventListener('click', closeModal);
    document.getElementById('__modal_cancel__').addEventListener('click', closeModal);
    modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });

    document.getElementById('__modal_save__').addEventListener('click', function() {
      var name  = document.getElementById('__new_name__').value.trim();
      var catEl = document.getElementById('__new_cat__');
      var cat   = catEl.value === '__new__'
        ? document.getElementById('__new_cat_custom__').value.trim()
        : catEl.value;
      var desc  = document.getElementById('__new_desc__').value.trim();
      var price = parseFloat(document.getElementById('__new_price__').value);

      if (!name || !cat || isNaN(price) || price <= 0) {
        document.getElementById('__new_err__').style.display = 'block';
        return;
      }

      // Add to MENU_DATA
      var newId = Math.max.apply(null, (window.__MENU_DATA_REF__||[{id:0}]).map(function(i){return i.id;})) + 1;
      var newItem = { id: newId, name: name, category: cat, description: desc, price: price, available: true, sortOrder: 999 };
      if (window.__MENU_DATA_REF__) {
        window.__MENU_DATA_REF__.push(newItem); window.__saveMenu__ && window.__saveMenu__();
      }

      // Add to CATEGORIES if new
      if (CATEGORIES.indexOf(cat) === -1) CATEGORIES.push(cat);

      // Show success toast-like message
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999999;box-shadow:0 4px 20px rgba(0,0,0,0.3)';
      toast.textContent = '"' + name + '" added to ' + cat;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 3000);

      closeModal();

      // Force a re-query so the menu list re-renders
      var ev = new CustomEvent('menuItemAdded', { detail: newItem });
      window.dispatchEvent(ev);
    });
  }

  // Poll for the menu tab being active
  var interval = setInterval(function() {
    var items = document.querySelectorAll('[data-testid^="avail-item"]');
    if (items.length > 0) {
      injectAddItemForm();
      injectToppings();
    } else {
      // Menu tab not active — remove injected sections so they re-inject when shown
      var ex = document.getElementById('__toppings_section__');
      if (ex) ex.remove();
      // Don't remove __add_item_bar__ — just hide it when off menu tab
      var exb = document.getElementById('__add_item_bar__');
      if (exb) exb.style.display = 'none';
    }
  }, 500);
})();
</script>
<script>
(function(){
  var PIN = '2016';
  var unlocked = false;
  var state = { q: '', comm: '', page: 0 };
  function esc(x){ return String(x == null ? '' : x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function money(n){ return '$' + (Number(n)||0).toFixed(2); }
  function D(){ return window.__DELIVERY__; }
  function save(){ window.__saveDelivery__ && window.__saveDelivery__(); }
  var INPUT = 'class="bg-background text-foreground border border-border dl-in"';
  var BTN = 'class="bg-primary text-primary-foreground" style="border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer"';
  var BTN2 = 'class="border border-border text-foreground" style="background:transparent;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer"';
  function toggle(on, attrs){
    return '<button ' + attrs + ' style="width:40px;height:22px;border-radius:11px;border:none;position:relative;cursor:pointer;background:' + (on ? '#c09b6d' : '#9ca3af') + ';flex-shrink:0' + (unlocked ? '' : ';opacity:.6') + '">'
      + '<span style="position:absolute;top:3px;left:' + (on ? '21' : '3') + 'px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s"></span></button>';
  }
  function card(title, body, sub){
    return '<div class="bg-card border border-border rounded-xl" style="margin-bottom:16px;overflow:hidden">'
      + '<div class="border-b border-border bg-muted/30" style="padding:10px 16px"><p style="margin:0;font-size:13px;font-weight:700">' + title + '</p>'
      + (sub ? '<p class="text-muted-foreground" style="margin:2px 0 0;font-size:12px">' + sub + '</p>' : '') + '</div>'
      + '<div style="padding:12px 16px">' + body + '</div></div>';
  }
  function render(root){
    var d = D(); if (!d) { root.innerHTML = '<p style="padding:20px">Delivery data not loaded.</p>'; return; }
    var counts = {}; d.streets.forEach(function(s){ counts[s.c] = (counts[s.c]||0) + 1; });
    var dis = unlocked ? '' : ' disabled';
    var h = '<div style="padding:20px;max-width:900px">';
    h += '<h1 class="font-serif text-2xl" style="margin:0 0 4px">Delivery</h1>';
    h += '<p class="text-muted-foreground" style="margin:0 0 16px;font-size:13px">Delivery area: Barcovan Beach Rd (NW) to Hwy 62 (E), Wellington (S), cut off at County Rd 40 / Wooler Rd in Carrying Place (N). Customers must pick a street from this list to order delivery.</p>';
    h += '<details open class="bg-card border border-border rounded-xl" style="margin-bottom:16px;overflow:hidden">'
      + '<summary class="border-b border-border bg-muted/30" style="padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer">Delivery Area Map</summary>'
      + '<a href="./assets/delivery-area-map.jpg" target="_blank" rel="noopener" style="display:block;background:#fff"><img src="./assets/delivery-area-map.jpg" alt="Map of the delivery area with streets coloured by community" style="display:block;width:100%;height:auto"></a>'
      + '<p class="text-muted-foreground" style="margin:0;padding:8px 16px 10px;font-size:11px">Streets are coloured by community. Tap the map to open it full size. Current fees are in the list below.</p>'
      + '</details>';
    // PIN bar
    if (!unlocked) {
      h += '<div class="bg-muted/30 border border-border rounded-xl" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;margin-bottom:16px">'
        + '<span class="text-muted-foreground" style="font-size:12px">Manager PIN to edit delivery:</span>'
        + '<input id="dl_pin" type="password" maxlength="8" placeholder="\u2022\u2022\u2022\u2022" ' + INPUT + ' style="width:80px;border-radius:6px;padding:4px 8px;font-size:12px">'
        + '<button id="dl_unlock" ' + BTN + '>Unlock</button><span id="dl_pin_err" style="display:none;color:#dc2626;font-size:12px">Incorrect PIN</span></div>';
    } else {
      h += '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 14px;margin-bottom:16px;border-radius:12px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35)">'
        + '<span style="font-size:12px;font-weight:600;color:#b45309">\uD83D\uDD13 Delivery editing unlocked</span><button id="dl_lock" style="background:none;border:none;color:#b45309;text-decoration:underline;font-size:12px;cursor:pointer">Lock</button></div>';
    }
    // Settings
    var sb = '<div style="display:flex;flex-direction:column;gap:12px">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><p style="margin:0;font-size:13px;font-weight:600">Delivery available</p><p class="text-muted-foreground" style="margin:0;font-size:12px">Turn off to hide the Delivery option for customers</p></div>' + toggle(d.enabled !== false, 'id="dl_enabled"' + dis) + '</div>'
      + '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><p style="margin:0;font-size:13px;font-weight:600">Minimum order for delivery</p><p class="text-muted-foreground" style="margin:0;font-size:12px">Food subtotal before tax. 0 = no minimum</p></div><input id="dl_min" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" value="' + (Number(d.minOrder) ? Number(d.minOrder).toFixed(2) : '') + '" ' + INPUT + ' style="width:100px;border-radius:6px;padding:6px 8px;font-size:13px"' + dis + '></div>'
      + '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><p style="margin:0;font-size:13px;font-weight:600">Free delivery over</p><p class="text-muted-foreground" style="margin:0;font-size:12px">Food subtotal before tax. 0 = never free</p></div><input id="dl_free" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" value="' + (Number(d.freeOver) ? Number(d.freeOver).toFixed(2) : '') + '" ' + INPUT + ' style="width:100px;border-radius:6px;padding:6px 8px;font-size:13px"' + dis + '></div>'
      + '</div>';
    h += card('Delivery Settings', sb, unlocked ? 'Type a new amount, then tap Done / Enter or tap outside the box to save.' : 'Locked \u2014 enter the manager PIN above to make changes.');
    // Communities
    var cb = '<div style="display:flex;flex-direction:column">';
    d.communities.forEach(function(c, i){
      cb += '<div class="border-b border-border" style="display:flex;align-items:center;gap:8px;padding:8px 0">'
        + '<div style="flex:1;min-width:110px"><p style="margin:0;font-size:13px;font-weight:600">' + esc(c.name) + '</p><p class="text-muted-foreground" style="margin:0;font-size:11px">' + (c.km != null ? '~' + c.km + ' km \u00b7 ' : '') + (counts[c.name]||0) + ' streets</p></div>'
        + '<span class="text-muted-foreground" style="font-size:13px">$</span><input data-fee="' + i + '" type="number" step="0.01" min="0" inputmode="decimal" value="' + (Number(c.fee)||0).toFixed(2) + '" ' + INPUT + ' style="width:72px;border-radius:6px;padding:6px 8px;font-size:13px"' + dis + '>'
        + toggle(c.active !== false, 'data-cact="' + i + '"' + dis)
        + (unlocked ? '<button data-cdel="' + i + '" title="Remove community" style="background:none;border:none;color:#dc2626;font-size:16px;cursor:pointer;padding:0 4px">\u2715</button>' : '')
        + '</div>';
    });
    cb += '</div>';
    if (unlocked) cb += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><input id="dl_new_c" placeholder="New community name" ' + INPUT + ' style="flex:1;min-width:160px;border-radius:6px;padding:6px 8px;font-size:13px"><input id="dl_new_cfee" type="number" step="0.01" min="0" placeholder="Fee" ' + INPUT + ' style="width:84px;border-radius:6px;padding:6px 8px;font-size:13px"><button id="dl_add_c" ' + BTN + '>+ Add Community</button></div>';
    h += card('Delivery Fees by Community', cb, 'Each street belongs to a community. The customer pays that community\u2019s fee. Toggle off to stop delivering there.');
    // Streets
    var q = state.q.toLowerCase();
    var list = d.streets.map(function(s, i){ return {s:s, i:i}; }).filter(function(o){
      return (!state.comm || o.s.c === state.comm) && (!q || o.s.s.toLowerCase().indexOf(q) >= 0);
    });
    var PER = 50, pages = Math.max(1, Math.ceil(list.length / PER)); if (state.page >= pages) state.page = pages - 1;
    var shown = list.slice(state.page * PER, state.page * PER + PER);
    var commOpts = function(sel){ return d.communities.map(function(c){ return '<option value="' + esc(c.name) + '"' + (c.name === sel ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join(''); };
    var stb = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><input id="dl_q" placeholder="Search streets..." value="' + esc(state.q) + '" ' + INPUT + ' style="flex:1;min-width:160px;border-radius:6px;padding:6px 8px;font-size:13px">'
      + '<select id="dl_fc" ' + INPUT + ' style="border-radius:6px;padding:6px 8px;font-size:13px"><option value="">All communities</option>' + commOpts(state.comm) + '</select></div>';
    stb += '<p class="text-muted-foreground" style="margin:0 0 6px;font-size:12px">' + list.length + ' of ' + d.streets.length + ' streets</p>';
    shown.forEach(function(o){
      var s = o.s;
      stb += '<div class="border-b border-border" style="display:flex;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap">'
        + '<span style="flex:1;min-width:140px;font-size:13px' + (s.a === false ? ';text-decoration:line-through;opacity:.6' : '') + '">' + esc(s.s) + '</span>'
        + (unlocked ? '<select data-scomm="' + o.i + '" ' + INPUT + ' style="border-radius:6px;padding:4px 6px;font-size:12px;max-width:170px">' + commOpts(s.c) + '</select>' : '<span class="text-muted-foreground" style="font-size:12px">' + esc(s.c) + '</span>')
        + toggle(s.a !== false, 'data-sact="' + o.i + '"' + dis)
        + (unlocked ? '<button data-sdel="' + o.i + '" title="Delete street" style="background:none;border:none;color:#dc2626;font-size:15px;cursor:pointer;padding:0 4px">\u2715</button>' : '')
        + '</div>';
    });
    if (pages > 1) stb += '<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px"><button id="dl_prev" ' + BTN2 + (state.page === 0 ? ' disabled' : '') + '>\u2039 Prev</button><span style="font-size:12px">Page ' + (state.page + 1) + ' of ' + pages + '</span><button id="dl_next" ' + BTN2 + (state.page >= pages - 1 ? ' disabled' : '') + '>Next \u203a</button></div>';
    if (unlocked) {
      stb += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px" class="border-t border-border"><input id="dl_new_s" placeholder="New street name (e.g. Smith Road)" ' + INPUT + ' style="flex:1;min-width:180px;border-radius:6px;padding:6px 8px;font-size:13px"><select id="dl_new_sc" ' + INPUT + ' style="border-radius:6px;padding:6px 8px;font-size:13px">' + commOpts(state.comm || (d.communities[0] && d.communities[0].name)) + '</select><button id="dl_add_s" ' + BTN + '>+ Add Street</button></div>'
        + '<div style="margin-top:12px;text-align:right"><button id="dl_reset" class="border border-border" style="background:transparent;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:#dc2626">Reset street list to original</button></div>';
    }
    h += card('Street Database', stb, 'Built from OpenStreetMap road data for the delivery area. Add any missing private lanes, or turn off streets you don\u2019t want to deliver to.');
    h += '</div>';
    root.innerHTML = '<style>.dl-in:disabled{opacity:.55;cursor:not-allowed}</style>' + h;
    wire(root);
  }
  function toast(msg){
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:999999';
    document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 1800);
  }
  function wire(root){
    var d = D();
    function $(id){ return root.querySelector('#' + id); }
    function rerender(cb){ setTimeout(function(){ var y = root.closest('.overflow-y-auto'); var top = y ? y.scrollTop : 0; render(root); if (y) y.scrollTop = top; if (cb) cb(); }, 0); }
    if ($('dl_unlock')) {
      var go = function(){ if ($('dl_pin').value === PIN) { unlocked = true; rerender(); } else { $('dl_pin_err').style.display = 'inline'; $('dl_pin').value = ''; } };
      $('dl_unlock').onclick = go; $('dl_pin').onkeydown = function(e){ if (e.key === 'Enter') go(); };
    }
    if ($('dl_lock')) $('dl_lock').onclick = function(){ unlocked = false; rerender(); };
    if ($('dl_q')) $('dl_q').oninput = function(e){ state.q = e.target.value; state.page = 0; var pos = e.target.selectionStart; rerender(function(){ var n = root.querySelector('#dl_q'); if (!n) return; n.focus(); try { n.setSelectionRange(pos, pos); } catch(x) {} }); };
    if ($('dl_fc')) $('dl_fc').onchange = function(e){ state.comm = e.target.value; state.page = 0; rerender(); };
    if ($('dl_prev')) $('dl_prev').onclick = function(){ state.page--; rerender(); };
    if ($('dl_next')) $('dl_next').onclick = function(){ state.page++; rerender(); };
    if (!unlocked) return;
    root.querySelectorAll('input[type=number]').forEach(function(el){
      el.addEventListener('focus', function(){ var t = el; setTimeout(function(){ try { t.select(); } catch(x) {} }, 0); });
      el.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
    });
    $('dl_enabled').onclick = function(){ d.enabled = !(d.enabled !== false); save(); rerender(); toast(d.enabled ? 'Delivery turned on' : 'Delivery turned off'); };
    $('dl_min').onchange = function(e){ d.minOrder = Math.max(0, Math.round((parseFloat(e.target.value)||0)*100)/100); save(); rerender(); toast(d.minOrder > 0 ? 'Delivery minimum: ' + money(d.minOrder) : 'No delivery minimum'); };
    $('dl_free').onchange = function(e){ d.freeOver = Math.max(0, Math.round((parseFloat(e.target.value)||0)*100)/100); save(); rerender(); toast(d.freeOver > 0 ? 'Free delivery over ' + money(d.freeOver) : 'Free delivery off'); };
    root.querySelectorAll('[data-fee]').forEach(function(el){ el.onchange = function(){ var c = d.communities[+el.getAttribute('data-fee')]; c.fee = Math.max(0, Math.round((parseFloat(el.value)||0)*100)/100); save(); rerender(); toast(c.name + ' fee: ' + money(c.fee)); }; });
    root.querySelectorAll('[data-cact]').forEach(function(el){ el.onclick = function(){ var c = d.communities[+el.getAttribute('data-cact')]; c.active = !(c.active !== false); save(); rerender(); }; });
    root.querySelectorAll('[data-cdel]').forEach(function(el){ el.onclick = function(){
      var i = +el.getAttribute('data-cdel'), c = d.communities[i];
      var n = d.streets.filter(function(s){ return s.c === c.name; }).length;
      if (!confirm('Remove ' + c.name + '?' + (n ? ' Its ' + n + ' streets will also be removed.' : ''))) return;
      d.streets = d.streets.filter(function(s){ return s.c !== c.name; }); d.communities.splice(i, 1); save(); rerender();
    }; });
    $('dl_add_c').onclick = function(){
      var name = $('dl_new_c').value.trim(), fee = parseFloat($('dl_new_cfee').value);
      if (!name) return toast('Enter a community name');
      if (d.communities.some(function(c){ return c.name.toLowerCase() === name.toLowerCase(); })) return toast('That community already exists');
      d.communities.push({name:name, fee: isNaN(fee) ? 0 : Math.round(fee*100)/100, active:true}); save(); rerender(); toast(name + ' added');
    };
    root.querySelectorAll('[data-scomm]').forEach(function(el){ el.onchange = function(){ d.streets[+el.getAttribute('data-scomm')].c = el.value; save(); rerender(); }; });
    root.querySelectorAll('[data-sact]').forEach(function(el){ el.onclick = function(){ var s = d.streets[+el.getAttribute('data-sact')]; s.a = !(s.a !== false); save(); rerender(); }; });
    root.querySelectorAll('[data-sdel]').forEach(function(el){ el.onclick = function(){ var s = d.streets[+el.getAttribute('data-sdel')]; if (!confirm('Delete ' + s.s + ' (' + s.c + ')?')) return; d.streets.splice(+el.getAttribute('data-sdel'), 1); save(); rerender(); }; });
    $('dl_add_s').onclick = function(){
      var name = $('dl_new_s').value.trim(), c = $('dl_new_sc').value;
      if (!name) return toast('Enter a street name');
      if (d.streets.some(function(s){ return s.s.toLowerCase() === name.toLowerCase() && s.c === c; })) return toast('That street is already listed');
      d.streets.push({s:name, c:c, a:true}); d.streets.sort(function(a,b){ return a.s.localeCompare(b.s) || a.c.localeCompare(b.c); });
      save(); state.q = name; state.comm = ''; state.page = 0; rerender(); toast(name + ' added to ' + c);
    };
    $('dl_reset').onclick = function(){
      if (!confirm('Reset the street list to the original? Streets you added or changed will be lost. Fees and settings are kept.')) return;
      var seed = window.__DELIVERY_SEED__; d.streets = JSON.parse(JSON.stringify(seed.streets));
      seed.communities.forEach(function(sc){ if (!d.communities.some(function(c){ return c.name === sc.name; })) d.communities.push(JSON.parse(JSON.stringify(sc))); });
      save(); rerender(); toast('Street list reset');
