      + '<button id="__pin_btn__" style="font-size:12px;padding:3px 12px;background:#c09b6d;color:#0d1b34;border:none;border-radius:4px;cursor:pointer;font-weight:600">Unlock</button>'
      + '<span id="__pin_err__" style="font-size:11px;color:#dc2626;display:none">Incorrect PIN</span>';

    var toppingContainer = document.createElement('div');

    wrapper.appendChild(pinBar);
    wrapper.appendChild(toppingContainer);

    // Find the best container — walk up to the scrollable/card parent
    var scrollContainer = items[0].closest('.max-w-2xl')
      || items[0].closest('[class*="max-w"]')
      || items[0].closest('[class*="overflow-auto"]')
      || items[0].closest('main');
    if (scrollContainer) {
      scrollContainer.appendChild(wrapper);
    } else if (parent.parentElement) {
      parent.parentElement.appendChild(wrapper);
    } else {
      parent.appendChild(wrapper);
    }

    renderToppings(toppingContainer, false);

    function handleUnlock() {
      var val = document.getElementById('__pin_input__').value;
      if (val === ADMIN_PIN) {
        pinUnlocked = true;
        document.getElementById('__pin_input__').style.display = 'none';
        document.getElementById('__pin_btn__').textContent = 'Lock';
        document.getElementById('__pin_btn__').style.background = '#555';
        document.getElementById('__pin_err__').style.display = 'none';
        renderToppings(toppingContainer, true);
        document.getElementById('__pin_btn__').removeEventListener('click', arguments.callee);
        document.getElementById('__pin_btn__').addEventListener('click', function() {
          pinUnlocked = false;
          // Re-show PIN input, reset button
          document.getElementById('__pin_input__').value = '';
          document.getElementById('__pin_input__').style.display = 'inline-block';
          document.getElementById('__pin_btn__').textContent = 'Unlock';
          document.getElementById('__pin_btn__').style.background = '#c09b6d';
          renderToppings(toppingContainer, false);
          // Re-wire unlock button
          document.getElementById('__pin_btn__').removeEventListener('click', arguments.callee);
          document.getElementById('__pin_btn__').addEventListener('click', handleUnlock);
        });
      } else {
        document.getElementById('__pin_err__').style.display = 'inline';
        document.getElementById('__pin_input__').value = '';
      }
    }
    document.getElementById('__pin_btn__').addEventListener('click', handleUnlock);
  }

  // ── Add Item Form ─────────────────────────────────────────────────────────
  var CATEGORIES = ["Specialty Pizza","Build Your Own","Shareables","Salads","Big Bites","Sides","Dips"];
  var addItemPinUnlocked = false;

  function injectAddItemForm() {
    // Use a fixed overlay bar that doesn't affect DOM layout at all
    var existing = document.getElementById('__add_item_bar__');
    var onMenuTab = document.querySelectorAll('[data-testid^="avail-item"]').length > 0;

    if (!onMenuTab) {
      if (existing) existing.style.display = 'none';
      return;
    }

    if (existing) {
      existing.style.display = 'flex';
      return;
    }

    var isDark = document.documentElement.classList.contains('dark');
    var bg     = isDark ? '#1a1a1a' : '#ffffff';
    var border = isDark ? '#2a2a2a' : '#e5e7eb';
    var text   = isDark ? '#f5f5f5' : '#111827';
    var muted  = isDark ? '#888'    : '#6b7280';
    var mutedBg= isDark ? 'rgba(17,17,17,0.97)' : 'rgba(249,250,251,0.97)';

    var bar = document.createElement('div');
    bar.id = '__add_item_bar__';
    // Fixed at bottom of screen — avoids any layout interference
    bar.style.cssText = 'position:fixed;bottom:0;left:220px;right:0;z-index:9999;'
      + 'padding:10px 20px;border-top:1px solid '+border+';background:'+mutedBg+';'
      + 'display:flex;align-items:center;gap:10px;flex-wrap:wrap;'
      + 'backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);';

    if (!addItemPinUnlocked) {
      bar.innerHTML = '<span style="font-size:12px;color:'+muted+';white-space:nowrap">Manager PIN to add items:</span>'
        + '<input id="__add_pin_input__" type="password" maxlength="8" placeholder="••••" '
        + 'style="width:64px;font-size:12px;border:1px solid '+border+';border-radius:4px;padding:3px 6px;background:'+bg+';color:'+text+'">'
        + '<button id="__add_pin_btn__" style="font-size:12px;padding:3px 12px;background:#c09b6d;color:#0d1b34;border:none;border-radius:4px;cursor:pointer;font-weight:600">Unlock</button>'
        + '<span id="__add_pin_err__" style="font-size:11px;color:#dc2626;display:none">Incorrect PIN</span>';
    } else {
      bar.innerHTML = '<button id="__add_item_btn__" style="font-size:12px;padding:5px 16px;background:#c09b6d;color:#0d1b34;border:none;border-radius:6px;cursor:pointer;font-weight:600">+ Add New Item</button>'
        + '<button id="__add_lock_btn__" style="font-size:11px;padding:4px 10px;background:transparent;color:'+muted+';border:1px solid '+border+';border-radius:6px;cursor:pointer">Lock</button>';
    }

    document.body.appendChild(bar);

    if (!addItemPinUnlocked) {
      function handleAddPin() {
        if (document.getElementById('__add_pin_input__').value === '2016') {
          addItemPinUnlocked = true;
          bar.remove();
          injectAddItemForm();
        } else {
          document.getElementById('__add_pin_err__').style.display = 'inline';
          document.getElementById('__add_pin_input__').value = '';
        }
      }
      document.getElementById('__add_pin_btn__').addEventListener('click', handleAddPin);
      document.getElementById('__add_pin_input__').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleAddPin();
      });
    } else {
      document.getElementById('__add_item_btn__').addEventListener('click', function() {
        showAddItemModal();
      });
      document.getElementById('__add_lock_btn__').addEventListener('click', function() {
        addItemPinUnlocked = false;
        bar.remove();
        injectAddItemForm();
      });
    }
  }

  function showAddItemModal() {
    if (document.getElementById('__add_item_modal__')) return;
    var isDark = document.documentElement.classList.contains('dark');
    var bg     = isDark ? '#1a1a1a' : '#ffffff';
    var border = isDark ? '#2a2a2a' : '#e5e7eb';
    var text   = isDark ? '#f5f5f5' : '#111827';
    var muted  = isDark ? '#888'    : '#6b7280';
    var overlay= isDark ? 'rgba(0,0,0,0.7)' : 'rgba(0,0,0,0.5)';

    var catOptions = CATEGORIES.map(function(c) {
      return '<option value="'+c+'">'+c+'</option>';
    }).join('');

    var modal = document.createElement('div');
    modal.id = '__add_item_modal__';
    modal.style.cssText = 'position:fixed;inset:0;z-index:99999;background:'+overlay+';display:flex;align-items:center;justify-content:center;padding:20px';

    modal.innerHTML = '<div style="background:'+bg+';border-radius:16px;padding:24px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,0.3)">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">'
      + '<h2 style="font-family:Georgia,serif;font-size:20px;color:'+text+';margin:0">Add New Item</h2>'
      + '<button id="__modal_close__" style="background:none;border:none;font-size:20px;color:'+muted+';cursor:pointer">✕</button>'
      + '</div>'
      // Name
      + '<div style="margin-bottom:14px">'
      + '<label style="font-size:12px;font-weight:600;color:'+muted+';display:block;margin-bottom:4px">Item Name *</label>'
      + '<input id="__new_name__" type="text" placeholder="e.g. Caesar Wrap" style="width:100%;font-size:14px;border:1px solid '+border+';border-radius:8px;padding:8px 12px;background:'+bg+';color:'+text+';box-sizing:border-box">'
      + '</div>'
      // Category
      + '<div style="margin-bottom:14px">'
      + '<label style="font-size:12px;font-weight:600;color:'+muted+';display:block;margin-bottom:4px">Category *</label>'
      + '<select id="__new_cat__" style="width:100%;font-size:14px;border:1px solid '+border+';border-radius:8px;padding:8px 12px;background:'+bg+';color:'+text+';box-sizing:border-box;margin-bottom:6px">'
      + catOptions
      + '<option value="__new__">+ New category...</option>'
      + '</select>'
      + '<input id="__new_cat_custom__" type="text" placeholder="New category name" style="width:100%;font-size:14px;border:1px solid '+border+';border-radius:8px;padding:8px 12px;background:'+bg+';color:'+text+';box-sizing:border-box;display:none">'
      + '</div>'
      // Description
      + '<div style="margin-bottom:14px">'
      + '<label style="font-size:12px;font-weight:600;color:'+muted+';display:block;margin-bottom:4px">Description</label>'
      + '<input id="__new_desc__" type="text" placeholder="e.g. Grilled chicken, romaine, parmesan" style="width:100%;font-size:14px;border:1px solid '+border+';border-radius:8px;padding:8px 12px;background:'+bg+';color:'+text+';box-sizing:border-box">'
      + '</div>'
      // Price
      + '<div style="margin-bottom:20px">'
      + '<label style="font-size:12px;font-weight:600;color:'+muted+';display:block;margin-bottom:4px">Price *</label>'
      + '<div style="display:flex;align-items:center;border:1px solid '+border+';border-radius:8px;overflow:hidden">'
      + '<span style="padding:8px 12px;background:'+muted+';color:#fff;font-size:14px;font-weight:600">$</span>'
      + '<input id="__new_price__" type="number" step="0.01" min="0" placeholder="0.00" style="flex:1;font-size:14px;border:none;padding:8px 12px;background:'+bg+';color:'+text+';outline:none">'
      + '</div>'
      + '</div>'
      // Error
      + '<p id="__new_err__" style="color:#dc2626;font-size:12px;margin:0 0 12px;display:none">Please fill in all required fields.</p>'
      // Buttons
      + '<div style="display:flex;gap:10px">'
      + '<button id="__modal_cancel__" style="flex:1;padding:10px;border:1px solid '+border+';border-radius:8px;background:transparent;color:'+text+';font-size:14px;cursor:pointer">Cancel</button>'
      + '<button id="__modal_save__" style="flex:1;padding:10px;border:none;border-radius:8px;background:#c09b6d;color:#0d1b34;font-size:14px;font-weight:600;cursor:pointer">Add Item</button>'
      + '</div>'
      + '</div>';

    document.body.appendChild(modal);

    // Show/hide custom category input
    document.getElementById('__new_cat__').addEventListener('change', function() {
      document.getElementById('__new_cat_custom__').style.display = this.value === '__new__' ? 'block' : 'none';
    });

    function closeModal() { modal.remove(); }
    document.getElementById('__modal_close__').addEventListener('click', closeModal);
    document.getElementById('__modal_cancel__').addEventListener('click', closeModal);
    modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });

    document.getElementById('__modal_save__').addEventListener('click', function() {
      var name  = document.getElementById('__new_name__').value.trim();
      var catEl = document.getElementById('__new_cat__');
      var cat   = catEl.value === '__new__'
        ? document.getElementById('__new_cat_custom__').value.trim()
        : catEl.value;
      var desc  = document.getElementById('__new_desc__').value.trim();
      var price = parseFloat(document.getElementById('__new_price__').value);

      if (!name || !cat || isNaN(price) || price <= 0) {
        document.getElementById('__new_err__').style.display = 'block';
        return;
      }

      // Add to MENU_DATA
      var newId = Math.max.apply(null, (window.__MENU_DATA_REF__||[{id:0}]).map(function(i){return i.id;})) + 1;
      var newItem = { id: newId, name: name, category: cat, description: desc, price: price, available: true, sortOrder: 999 };
      if (window.__MENU_DATA_REF__) {
        window.__MENU_DATA_REF__.push(newItem);
      }

      // Add to CATEGORIES if new
      if (CATEGORIES.indexOf(cat) === -1) CATEGORIES.push(cat);

      // Show success toast-like message
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999999;box-shadow:0 4px 20px rgba(0,0,0,0.3)';
      toast.textContent = '"' + name + '" added to ' + cat;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 3000);

      closeModal();

      // Force a re-query so the menu list re-renders
      var ev = new CustomEvent('menuItemAdded', { detail: newItem });
      window.dispatchEvent(ev);
    });
  }

  // Poll for the menu tab being active
  var interval = setInterval(function() {
    var items = document.querySelectorAll('[data-testid^="avail-item"]');
    if (items.length > 0) {
      injectAddItemForm();
      injectToppings();
    } else {
      // Menu tab not active — remove injected sections so they re-inject when shown
      var ex = document.getElementById('__toppings_section__');
      if (ex) ex.remove();
      // Don't remove __add_item_bar__ — just hide it when off menu tab
      var exb = document.getElementById('__add_item_bar__');
      if (exb) exb.style.display = 'none';
    }
  }, 500);
})();
</script>
